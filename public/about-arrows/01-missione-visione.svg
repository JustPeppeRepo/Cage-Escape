<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!--
    TEMPLATE 1  Missione ù Visione
    Disegna la freccia dal cerchio VERDE (start) al cerchio ROSSO (end).
    Includi la punta. Poi esporta / copia il path `d` in aboutArrowArt.ts
  -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  <text x="12" y="18" fill="#852026" font-family="sans-serif" font-size="11">Missione ù Visione  disegna qui</text>
  <!-- area gutter suggerita (destra) -->
  <rect x="220" y="20" width="160" height="200" fill="#161616" stroke="#333" stroke-dasharray="4 4"/>
  <text x="230" y="40" fill="#666" font-family="sans-serif" font-size="10">spazio vuoto</text>

  <!-- START -->
  <circle cx="40" cy="40" r="8" fill="none" stroke="#39ff88" stroke-width="2"/>
  <text x="54" y="44" fill="#39ff88" font-family="sans-serif" font-size="10">START</text>
  <!-- END -->
  <circle cx="360" cy="260" r="8" fill="none" stroke="#E8B4B8" stroke-width="2"/>
  <text x="300" y="264" fill="#E8B4B8" font-family="sans-serif" font-size="10">END</text>

  <!-- path di esempio da sostituire: id="arrow" -->
  <path
    id="arrow"
    d="M40 40 C 100 48, 170 55, 230 85 C 290 115, 330 150, 310 185 C 290 220, 320 245, 360 260"
    fill="none"
    stroke="#E8B4B8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 342 246 L 360 260 L 348 276"
    fill="none"
    stroke="#E8B4B8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
