<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!--
    TEMPLATE 2  Visione ù Fondatore
    Disegna dal VERDE (start) al ROSSO (end). Ondeggia a sinistra nello spazio vuoto.
  -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  <text x="12" y="18" fill="#852026" font-family="sans-serif" font-size="11">Visione ù Fondatore  disegna qui</text>
  <rect x="20" y="60" width="160" height="180" fill="#161616" stroke="#333" stroke-dasharray="4 4"/>
  <text x="30" y="80" fill="#666" font-family="sans-serif" font-size="10">spazio vuoto</text>

  <circle cx="40" cy="40" r="8" fill="none" stroke="#39ff88" stroke-width="2"/>
  <text x="54" y="44" fill="#39ff88" font-family="sans-serif" font-size="10">START</text>
  <circle cx="360" cy="260" r="8" fill="none" stroke="#A8D5C5" stroke-width="2"/>
  <text x="300" y="264" fill="#A8D5C5" font-family="sans-serif" font-size="10">END</text>

  <path
